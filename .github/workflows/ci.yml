name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, test, build, a11y & Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build (includes static /work/:slug page generation)
        run: npm run build

      - name: Serve production build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done

      - name: Accessibility scan (axe-core)
        # @axe-core/cli bundles a ChromeDriver pinned to one Chrome major (150), but the runner image's Chrome
        # moves on independently (154) -> "session not created". GitHub runners ship a driver that matches
        # their own Chrome at $CHROMEWEBDRIVER, so use that instead of the bundled one.
        run: |
          DRIVER="$CHROMEWEBDRIVER/chromedriver"
          npx axe http://localhost:4173/ --load-delay 2000 --exit --chromedriver-path "$DRIVER"
          npx axe http://localhost:4173/work/fraudshield/ --load-delay 2000 --exit --chromedriver-path "$DRIVER"
          npx axe http://localhost:4173/uses --load-delay 2000 --exit --chromedriver-path "$DRIVER"

      - name: Lighthouse CI (desktop — enforced)
        run: npx lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Lighthouse CI (mobile — perf warn-only, a11y/BP/SEO enforced)
        run: npx lhci autorun --config=lighthouserc.mobile.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  e2e:
    # Real-Chrome end-to-end suite (e2e/*.e2e.ts) against the production build. A separate job so a timing flake
    # on a slower runner shows up as its own check rather than failing the lint/test/build/Lighthouse gate; once
    # it has proven stable it can be made a required check. The on-device ML tests skip themselves here (the
    # checkout has no Git LFS, so the model files are pointers) and run locally with `npm run e2e`.
    name: End-to-end (Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e
